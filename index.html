<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rada</title>

<!-- Le anteprime social restano in inglese: i crawler leggono questi meta
     prima che il JavaScript giri, quindi qualunque lingua ci sia scritta qui
     è quella che appare quando si condivide il link. i18n.js li riscrive
     comunque nella lingua corrente, per i motori che eseguono lo script. -->
<meta name="description" content="Four sound phrases of different lengths that never come back together the same way. A generative instrument in the browser.">

<meta property="og:title" content="Rada">
<meta property="og:description" content="Four sound phrases of different lengths that never come back together the same way.">
<meta property="og:type" content="website">

<!-- favicon inline: il punto che pulsa. Data URI, così non c'è un file da
     servire e funziona anche aprendo index.html col doppio clic. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e9e7db'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c25a2b'/%3E%3C/svg%3E">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage">
 <div class="wrap">

  <div class="head">
    <h1>Ra<em>d</em>a</h1>
    <div class="headRight">
      <nav class="langs" id="langs" aria-label="Lingua"></nav>
      <span class="langSep" aria-hidden="true"></span>
      <div class="status" id="status">
        <span class="pulse"></span>
        <span id="statusText">in attesa</span>
      </div>
    </div>
  </div>

  <div class="loopCard">
    <div class="cardHead">
      <span class="t" data-i18n="card.title">Le quattro frasi</span>
      <span class="realign" id="realign">—</span>
    </div>
    <div class="loopHint" data-i18n="card.hint">trascina: durata · clic: silenzia · ↻ nuova idea</div>
    <div id="canvas-holder"></div>
  </div>

  <div class="controls">
    <div class="ctl">
      <label for="spread"><span data-i18n="ctl.spread">Ampiezza registro</span> <b id="vSpread">—</b></label>
      <input type="range" id="spread" min="0" max="100" value="45">
    </div>
    <div class="ctl">
      <label for="warmth"><span data-i18n="ctl.warmth">Calore timbrico</span> <b id="vWarmth">—</b></label>
      <input type="range" id="warmth" min="0" max="100" value="70">
    </div>
    <div class="ctl">
      <label for="rev"><span data-i18n="ctl.rev">Spazio / coda</span> <b id="vRev">—</b></label>
      <input type="range" id="rev" min="0" max="100" value="72">
    </div>
    <div class="ctl">
      <label for="dens"><span data-i18n="ctl.dens">Densità dell'idea</span> <b id="vDens">—</b></label>
      <input type="range" id="dens" min="2" max="14" value="5">
    </div>
    <div class="ctl">
      <label for="head"><span data-i18n="ctl.head">Addensamento</span> <b id="vHead">—</b></label>
      <input type="range" id="head" min="10" max="70" value="30">
    </div>
  </div>

  <div class="bar">
    <div class="moods" id="moods"></div>
    <button class="power" id="power">
      <span class="dot"></span><span id="powerLabel">Avvia</span>
    </button>
  </div>

  <!-- ------------------------------------------------------------------
       I quadranti vivono nel canvas, che per una tastiera e per un lettore
       di schermo è una superficie muta: qui sotto stanno gli STESSI comandi
       in HTML nativo, invisibili ma raggiungibili con Tab. Restano in sincronia
       col disegno in entrambe le direzioni (vedi bindA11y in ui.js).
  ------------------------------------------------------------------ -->
  <div class="srOnly" id="a11y">
    <h2 data-i18n="a11y.title">Comandi equivalenti da tastiera</h2>
    <div id="a11yLoops"></div>
  </div>

  <div class="foot">
    <!-- scheda nuova: il collage sta suonando, e una navigazione qui lo
         spegnerebbe perdendo la sessione in corso. Il ?da=strumento dice alla
         guida che Rada è già aperta di là, così non offre di riaprirla. -->
    <a class="docLink" href="guida.html?da=strumento" target="_blank" rel="noopener"
       data-i18n="ui.guide" data-i18n-aria="ui.guideAria">Guida</a>
  </div>

 </div>
</div>

<!-- Il cancello è una finestra modale vera: prima l'ingresso era un <div>,
     quindi non prendeva fuoco e chi naviga da tastiera restava chiuso fuori. -->
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <h2 id="gateTitle">Ra<em>d</em>a</h2>
  <p data-i18n="gate.text">Uno spazio sonoro nel quale si può indugiare nei propri ricordi mentre si guarda fuori dalla finestra.</p>
  <button class="enter" id="enter" type="button" data-i18n="gate.enter">Entra</button>
</div>

<!-- p5.js, versione fissata perché il progetto non cambi comportamento da solo.
     Per usarla in locale (senza rete): scarica p5.min.js in lib/ e sostituisci
     questa riga con  <script src="lib/p5.min.js"></script>  -->
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.min.js"
        integrity="sha384-hPm6eOZbf5TXzAfG+a6uOOtiu9ZbMnMIz/hZC9p+V0GG+xWXtXKNWz/5rvlJSCTn" crossorigin="anonymous"></script>

<!-- l'ordine conta: le parole e il modello prima (non dipendono da nulla),
     poi il suono, poi il disegno, infine i comandi -->
<script src="js/i18n.js"></script>
<script src="js/model.js"></script>
<script src="js/audio.js"></script>
<script src="js/sketch.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
